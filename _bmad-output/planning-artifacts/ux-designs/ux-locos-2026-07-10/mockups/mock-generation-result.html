<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>locos — Kết quả tạo ảnh</title>
<style>
  :root {
    --surface: #FFFFFF;
    --surface-dim: #F7F8FA;
    --surface-container: #EEF0F3;
    --outline: #E5E7EB;
    --outline-strong: #D1D5DB;
    --ink-primary: #0F172A;
    --ink-secondary: #475569;
    --ink-tertiary: #94A3B8;
    --accent: #2563EB;
    --accent-soft: #DBEAFE;
    --success: #16A34A;
    --warning: #D97706;
    --error: #DC2626;
    --sold-out: #6B7280;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #E5E7EB;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 24px 0 48px;
    min-height: 100vh;
  }

  .phone {
    width: 414px;
    min-height: 900px;
    background: var(--surface);
    position: relative;
    border: 1px solid var(--outline);
    overflow: hidden;
  }

  /* Top bar */
  .top-bar {
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--outline);
    background: var(--surface);
  }
  .top-bar .left { display: flex; align-items: center; gap: 8px; }
  .back-btn {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; cursor: pointer; color: var(--ink-primary);
  }
  .top-bar .title { font-size: 16px; font-weight: 600; color: var(--ink-primary); }
  .avatar {
    width: 32px; height: 32px; border-radius: 9999px;
    background: var(--surface-dim);
    border: 1px solid var(--outline);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-secondary); font-size: 13px; font-weight: 600;
  }

  /* Content */
  .content {
    padding: 16px 16px 140px;
  }

  .step-label {
    font-size: 12px; line-height: 1.4; font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-tertiary);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .heading {
    font-size: 22px; line-height: 1.3; font-weight: 600;
    color: var(--ink-primary);
    margin-bottom: 4px;
  }
  .subheading {
    font-size: 14px; line-height: 1.5;
    color: var(--ink-secondary);
    margin-bottom: 24px;
  }

  /* Generated image grid */
  .gen-section-label {
    font-size: 12px; line-height: 1.4; font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-tertiary);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .gen-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .gen-tile {
    position: relative;
    aspect-ratio: 4 / 5;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--outline);
    background: var(--surface-dim);
  }
  .gen-tile img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .gen-tile .overlay-actions {
    position: absolute;
    top: 6px; right: 6px;
    display: flex; gap: 4px;
  }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: rgba(255,255,255,0.94);
    border: 1px solid var(--outline);
    color: var(--ink-primary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .icon-btn.danger { color: var(--error); }

  /* Generation state label under tiles */
  .gen-state-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 24px;
    color: var(--ink-secondary);
    font-size: 14px; line-height: 1.5;
  }
  .gen-state-dot {
    width: 8px; height: 8px; border-radius: 9999px;
    background: var(--success);
  }

  /* Editable fields */
  .field {
    margin-bottom: 16px;
  }
  .field-label {
    font-size: 12px; line-height: 1.4; font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-tertiary);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .input,
  .textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink-primary);
    outline: none;
  }
  .input.title-input { font-size: 22px; line-height: 1.3; font-weight: 600; }
  .input::placeholder, .textarea::placeholder { color: var(--ink-tertiary); }
  .textarea { resize: none; min-height: 88px; }
  .input:focus, .textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 1.5px var(--accent);
  }

  .price-wrap {
    position: relative;
  }
  .price-wrap .input {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 16px;
    line-height: 1.4;
    text-align: right;
    padding-right: 40px;
  }
  .price-wrap .suffix {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--ink-tertiary);
    font-size: 16px;
    pointer-events: none;
  }

  /* Inline attribute row (collapsed view) */
  .attr-pill-row {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .attr-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-dim);
    border: 1px solid var(--outline);
    color: var(--ink-secondary);
    padding: 6px 12px;
    border-radius: 9999px;
    font-size: 13px;
    line-height: 1.4;
    font-weight: 500;
  }
  .attr-pill .x {
    color: var(--ink-tertiary);
    font-weight: 400;
  }

  /* Status pill above the action bar */
  .fb-callout {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--accent-soft);
    border: 1px solid #BFDBFE;
    border-radius: 10px;
    padding: 12px;
    margin-top: 8px;
  }
  .fb-callout .icon {
    flex: 0 0 20px;
    color: var(--accent);
    margin-top: 1px;
  }
  .fb-callout .copy { font-size: 14px; line-height: 1.5; color: var(--ink-primary); }
  .fb-callout .copy .name { font-weight: 600; }
  .fb-callout .copy .sub { color: var(--ink-secondary); }

  /* Bottom action bar */
  .action-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--outline);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    display: flex; gap: 8px;
    align-items: center;
  }
  .btn {
    flex: 1;
    height: 48px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary {
    background: var(--accent);
    color: var(--surface);
  }
  .btn-secondary {
    background: var(--surface);
    color: var(--ink-primary);
    border-color: var(--outline);
  }
  .btn-text {
    background: transparent;
    color: var(--accent);
    border: none;
    height: auto;
    padding: 8px 4px;
    flex: 0 0 auto;
  }
  .btn-row {
    display: flex; gap: 8px;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="phone">
  <!-- Top bar -->
  <div class="top-bar">
    <div class="left">
      <button class="back-btn" aria-label="Quay lại">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title">Sản phẩm mới</div>
    </div>
    <div class="avatar" aria-label="Tài khoản">C</div>
  </div>

  <div class="content">
    <div class="step-label">Bước 3 · Kết quả tạo ảnh</div>
    <div class="heading">Váy linen mùa hè</div>
    <div class="subheading">Bạn có thể chỉnh lại tiêu đề, mô tả và giá trước khi đăng.</div>

    <!-- Generated images -->
    <div class="gen-section-label">Ảnh người mẫu</div>
    <div class="gen-grid">
      <div class="gen-tile">
        <img src="https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=400&h=500&fit=crop" alt="Váy linen — ảnh người mẫu 1" />
        <div class="overlay-actions">
          <button class="icon-btn" aria-label="Tạo lại ảnh 1">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
          </button>
          <button class="icon-btn danger" aria-label="Xoá ảnh 1">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>
      <div class="gen-tile">
        <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=400&h=500&fit=crop" alt="Váy linen — ảnh người mẫu 2" />
        <div class="overlay-actions">
          <button class="icon-btn" aria-label="Tạo lại ảnh 2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
          </button>
          <button class="icon-btn danger" aria-label="Xoá ảnh 2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>
      <div class="gen-tile">
        <img src="https://images.unsplash.com/photo-1495121605193-b116b5b9c5fe?w=400&h=500&fit=crop" alt="Váy linen — ảnh người mẫu 3" />
        <div class="overlay-actions">
          <button class="icon-btn" aria-label="Tạo lại ảnh 3">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
          </button>
          <button class="icon-btn danger" aria-label="Xoá ảnh 3">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="gen-state-row">
      <span class="gen-state-dot"></span>
      <span>Đã tạo xong 3/3 ảnh</span>
      <span style="color: var(--ink-tertiary);">·</span>
      <button class="btn btn-text" style="height:auto; padding:0; font-weight:500; font-size:14px;">Tạo lại tất cả</button>
    </div>

    <!-- Selected attributes (collapsed preview) -->
    <div class="attr-pill-row">
      <span class="attr-pill">Nữ</span>
      <span class="attr-pill"><span class="x">·</span> Casual</span>
    </div>

    <!-- Editable title -->
    <div class="field">
      <div class="field-label">Tiêu đề</div>
      <input class="input title-input" value="Váy linen mùa hè — beige tự nhiên" />
    </div>

    <!-- Editable description -->
    <div class="field">
      <div class="field-label">Mô tả</div>
      <textarea class="textarea">Váy linen dáng suông, màu be tự nhiên. Chất vải mềm, thoáng mát phù hợp mùa hè. Form rộng nhẹ, dễ phối với áo thun hoặc sơ mi.</textarea>
    </div>

    <!-- Editable price -->
    <div class="field">
      <div class="field-label">Giá bán</div>
      <div class="price-wrap">
        <input class="input" value="350.000" />
        <span class="suffix">₫</span>
      </div>
    </div>

    <!-- FB connection callout -->
    <div class="fb-callout">
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg>
      </span>
      <div class="copy">
        <div class="name">Trang: Shop Chi Béo</div>
        <div class="sub">Đã kết nối — đăng lên Facebook sẽ tạo bài viết mới.</div>
      </div>
    </div>

    <!-- Auxiliary actions row (text buttons) -->
    <div class="btn-row">
      <button class="btn btn-text" style="flex:1; justify-content:flex-start;">Lưu bản nháp</button>
      <button class="btn btn-text" style="flex:0 0 auto;">Xem trước</button>
    </div>
  </div>

  <!-- Sticky action bar -->
  <div class="action-bar">
    <button class="btn btn-primary">Đăng sản phẩm</button>
    <button class="btn btn-secondary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg>
      Đăng lên Facebook
    </button>
  </div>
</div>
</body>
</html>
